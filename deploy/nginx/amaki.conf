###############################################################################
# Nginx PRODUCTION — RÉFÉRENCE / CHECKLIST (AMAKI amaki.fr)
# Fichier versionné : deploy/nginx/amaki.conf
#
# ⚠️  CE FICHIER N'EST PAS DÉPLOYÉ AUTOMATIQUEMENT.
#     scripts/deploy-production-safe.sh ne le copie PAS vers /etc/nginx.
#     La conf LIVE VPS (/etc/nginx/conf.d/amaki.conf) peut être plus riche
#     (TLS Certbot, ACL, locations supplémentaires). Toute mise à jour Nginx
#     est une étape HUMAINE contrôlée — ne pas écraser la conf live avec
#     ce fichier sans diff/revue préalable.
#
# TRUST_PROXY n'est autorisé que si nginx -T (conf EFFECTIVE) confirme :
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   upstream/proxy_pass → 127.0.0.1:9060
#
# Ne pas confondre avec deploy/nginx/amakifr-dev.conf (9052 / LAN mobile).
###############################################################################

upstream amakifr_prod_backend {
    server 127.0.0.1:9060;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name amaki.fr www.amaki.fr;
    return 301 https://amaki.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amaki.fr www.amaki.fr;

    # Certificats Let's Encrypt (chemins VPS — non secrets)
    ssl_certificate     /etc/letsencrypt/live/amaki.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amaki.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    access_log /var/log/nginx/amaki-access.log;
    error_log  /var/log/nginx/amaki-error.log;

    #########################################################################
    # MODE MAINTENANCE — flag /sites/amakifr/maintenance.flag
    #########################################################################
    set $maintenance 0;

    if (-f /sites/amakifr/maintenance.flag) {
        set $maintenance 1;
    }

    if ($maintenance = 1) {
        return 503;
    }

    error_page 503 @maintenance;

    location @maintenance {
        allow all;
        root /sites/amakifr/public;
        rewrite ^ /maintenance.html break;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        default_type text/html;
    }

    #########################################################################
    # Application Next.js (PM2 amakifr → 127.0.0.1:9060)
    #########################################################################
    location / {
        proxy_pass http://amakifr_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Écrase toute X-Real-IP fournie par le client — source de confiance IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /_next/static {
        alias /sites/amakifr/.next/static;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
